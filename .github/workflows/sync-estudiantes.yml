name: Sincronizar Portal de Estudiantes

on:
  push:
    paths:
      - 'index.html'
      - 'generar_portal_estudiantes.py'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-portal:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generar portal de estudiantes
        run: |
          python generar_portal_estudiantes.py

      - name: Guardar cambios si los hay
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add portal-estudiantes.html estudiantes.html
          git diff --staged --quiet || (git commit -m "Auto-sincronizar portal de estudiantes [skip ci]" && git push origin main)
