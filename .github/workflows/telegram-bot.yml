name: Bot de Telegram 24/7

on:
  schedule:
    # Se ejecuta cada 5 horas automáticamente para mantenerlo siempre despierto
    - cron: '0 */5 * * *'
  workflow_dispatch: # Permite arrancarlo manualmente con un clic en GitHub

concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 340 # Cada ejecución dura hasta ~5.5 horas antes de que el siguiente ciclo tome el relevo

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f telegram-bot/requirements.txt ]; then pip install -r telegram-bot/requirements.txt; fi

      - name: Ejecutar Bot de Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: main
        run: |
          python telegram-bot/bot.py
