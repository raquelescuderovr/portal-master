name: Bot de Telegram 24/7

on:
  push:
    branches:
      - main
  schedule:
    # Se ejecuta cada 5 horas automáticamente para mantenerlo siempre despierto
    - cron: '0 */5 * * *'
  workflow_dispatch: # Permite arrancarlo manualmente con un clic en GitHub

concurrency:
  group: telegram-bot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 340 # Cada ejecución dura hasta ~5.5 horas antes de que el siguiente ciclo tome el relevo

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f telegram-bot/requirements.txt ]; then pip install -r telegram-bot/requirements.txt; fi

      - name: Comprobar credenciales
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import os, sys
          t = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip().strip('\'\"')
          g = os.environ.get('GEMINI_API_KEY', '').strip().strip('\'\"')
          if not t:
              print('❌ TELEGRAM_BOT_TOKEN no está configurado en GitHub Secrets.', flush=True)
              sys.exit(1)
          if len(t) < 35:
              print(f'❌ TELEGRAM_BOT_TOKEN parece incompleto (tiene {len(t)} caracteres, debe tener ~46 caracteres).', flush=True)
              print('   Copia el token completo desde BotFather o desde la guía.', flush=True)
              sys.exit(1)
          if not g:
              print('❌ GEMINI_API_KEY no está configurado en GitHub Secrets.', flush=True)
              sys.exit(1)
          print(f'✅ Claves validadas correctamente (Telegram: {len(t)} chars, Gemini: {len(g)} chars).', flush=True)
          "

      - name: Ejecutar Bot de Telegram
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: main
        run: |
          python -u telegram-bot/bot.py
